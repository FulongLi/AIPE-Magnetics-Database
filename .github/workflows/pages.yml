name: Data Explorer (GitHub Pages)
# Builds the read-only explorer from the committed data store and deploys it to
# https://fulongli.github.io/AIPE-Magnetics-Database/. No importer runs and nothing is downloaded:
# tools/build_site.py only reads data/ through the package's MagneticDatabase and writes _site/.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/build_site.py"
      - "data/canonical/**"
      - "data/normalized/**"
      - "data/sources.json"
      - "src/aipe_magnetics_database/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the package (data-only dependencies)
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Build the site and its JSON indexes
        run: python tools/build_site.py --out _site
      - name: Canonical and normalised records are unchanged
        run: test -z "$(git status --porcelain -- data src)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
