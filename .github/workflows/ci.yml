name: AIPE Magnetics Database
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # legacy v0.1 artefact and first-MAS-import preservation checks read git history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package with development extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Legacy v0.1 checks still pass
        run: |
          python -m unittest discover -s tests -p "test_records.py" -v
          python scripts/validate.py examples/synthetic-transformer.json
      - name: Unit, data, store, ingestion and interface tests
        run: python -m pytest -q
      - name: Validate every committed record (schema v0.2, references, canonical layer)
        run: aipe-magnetics-db validate
      - name: Coverage report
        if: always()
        run: python -c "import json; c=json.load(open('data/reports/coverage.json')); print(json.dumps(c['canonical'], indent=2))"

  reproducibility:
    name: offline re-import of committed raw sources is byte-identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Re-run the Paderborn and Zenodo importers from data/raw and rebuild reports
        run: |
          aipe-magnetics-db refresh --source paderborn_lea_materialdatabase --source zenodo_8292861_hefmag --source zenodo_21626116_smc_ferrite_triangular
          git status --porcelain -- data/normalized data/raw docs/source-catalogue.md
          test -z "$(git status --porcelain -- data/normalized/paderborn-lea data/normalized/hefmag data/normalized/zenodo-smc-ferrite-triangular data/raw)"

  full-refresh:
    name: full refresh from pinned upstream files (downloads ~190 MB)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: aipe-magnetics-db refresh --allow-download --cache .aipe-cache
      - run: git status --porcelain && test -z "$(git status --porcelain -- data docs)"

  clean-install:
    name: clean-environment install from wheel (data bundled, no scipy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel
        run: python -m pip install --upgrade pip build && python -m build --wheel
      - name: Install into a fresh virtual environment and query offline
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl "mcp>=2,<3"
          cd /tmp
          /tmp/clean/bin/aipe-magnetics-db info
          /tmp/clean/bin/aipe-magnetics-db measurements find --material "TDK N87" -f "100 kHz" -t "90 degC"
          /tmp/clean/bin/python -m aipe_magnetics_database.mcp.server --self-test
          /tmp/clean/bin/python -c "import importlib.util as u; assert u.find_spec('scipy') is None and u.find_spec('aipe_magnetics_design') is None"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
