[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aipe-magnetics-database"
version = "0.3.0"
description = "AIPE Magnetics Database: standardised, provenance-tracked magnetic material, core-geometry and measurement data (Magnetic Data Schema v0.2) with query API, CLI and MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "NOASSERTION" }
authors = [{ name = "Fulong Li" }, { name = "AIPE Magnetics contributors" }]
keywords = ["magnetics", "power-electronics", "core-loss", "magnetic-materials", "ferrite", "dataset", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Operating System :: OS Independent",
]
# Data-only runtime: no scipy, plotting, CAD, FEA or machine-learning dependencies.
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.5",
  "jsonschema[format]>=4.23,<5",
  "referencing>=0.30",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.8"]
mcp = ["mcp>=2.0,<3"]
# publishing to the Hugging Face dataset (reading a published release needs no extra dependency)
hub = ["huggingface_hub>=2.4,<3"]
dev = [
  "huggingface_hub>=2.4,<3",
  "PyYAML>=6.0",
  "h5py>=3.8",
  "mcp>=2.0,<3",
  "pytest>=8",
  "pytest-cov>=5",
  "anyio>=4",
  "build>=1.0",
]
all = ["h5py>=3.8", "mcp>=2.0,<3", "huggingface_hub>=2.4,<3"]

[project.scripts]
aipe-magnetics-db = "aipe_magnetics_database.cli.main:main"
aipe-magnetics-db-mcp = "aipe_magnetics_database.mcp.server:main"

[project.urls]
Homepage = "https://github.com/FulongLi/AIPE-Magnetics-Database"
Repository = "https://github.com/FulongLi/AIPE-Magnetics-Database"
Changelog = "https://github.com/FulongLi/AIPE-Magnetics-Database/blob/main/CHANGELOG.md"
Design = "https://github.com/FulongLi/AIPE-Magnetics-Design"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aipe_magnetics_database" = [
  "py.typed",
  "schemas/**/*.json",
  "schemas/**/*.md",
  "data/catalog/**/*.json",
  "data/catalog/**/*.md",
  "data/derived/**/*.json",
  "data/reference/**/*.json",
  "data/fixtures/**/*",
  "ingest/pins/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "external: optional tests that need genuine external data or network access; they never skip silently and always report the reason",
  "slow: long-running tests",
  "hosts: tests that need the Claude Code or Codex CLI hosts installed",
]
