schema_version: 0.1.0
id: aipe.magnetics-database
name: AIPE Magnetics Database
type: tool
domains: [power-electronics]
description: "Standardised, provenance-tracked magnetic data: material properties, core geometries and parts, measured core-loss tables, complex permeability / permittivity and B-H curves from Princeton MagNet, Paderborn LEA, OpenMagnetics MAS, HEFMAG and further sources in Magnetic Data Schema v0.2, with deduplication, licences, query API, CLI and a read-only MCP server."
status: experimental
maturity: prototype
repository: https://github.com/FulongLi/AIPE-Magnetics-Database
license: NOASSERTION
capabilities:
  - magnetics-record-schema
  - magnetics-data-import
  - magnetics-data-validation
  - magnetics-data-migration
  - magnetics-waveform-storage
  - magnetics-source-adapters
  - magnetics-material-lookup
  - magnetics-measurement-query
  - magnetics-data-provenance
  - magnetics-mcp-server
  - magnetics-agent-plugin
inputs:
  - name: magnetic-record
    description: "Magnetic record (schema 0.1.0 or 0.2.0) with explicit evidence and SI units."
  - name: source-file
    description: "Pinned upstream source file (verified by SHA-256) or a user-supplied file of a non-redistributable source."
outputs:
  - name: magnetic-record
    description: "Schema v0.2 records (JSON / JSONL) with provenance, licence, data class and quality flags."
  - name: measurement-table
    description: "aipe.magnetics.table/0.1 tables: explicit columns with SI unit, original unit and definition; rows inline or as JSONL sidecars."
  - name: coverage-report
    description: "data/reports/coverage.json and import-<source>.json: per-source counts, exclusions and licence status."
dependencies: []
compatibility: {core: 0.1.x, engineering_state: 0.1.x, integration: native}
tools:
  - id: python
    name: Python
    capabilities: [magnetics-record-schema, magnetics-data-import, magnetics-data-validation, magnetics-data-migration, magnetics-waveform-storage, magnetics-source-adapters, magnetics-material-lookup, magnetics-measurement-query, magnetics-data-provenance, magnetics-mcp-server]
    licence_class: open_source
    optional: false
    interfaces: [cli, python, mcp]
    platforms: [linux, windows, macos]
    url: https://www.python.org/
    limitations:
      - "Data service only: no loss prediction, fitting, interpolation, design or optimisation (see AIPE-Magnetics-Design)."
      - "Schema validation is not an independent experimental verification; third-party values are unreviewed."
  - id: mcp-python-sdk
    name: Model Context Protocol Python SDK
    capabilities: [magnetics-mcp-server]
    licence_class: open_source
    optional: true
    interfaces: [mcp]
    platforms: [linux, windows, macos]
    url: https://github.com/modelcontextprotocol/python-sdk
    limitations: ["Local stdio transport only; read-only tools."]
  - id: claude-code
    name: Claude Code
    capabilities: [magnetics-agent-plugin]
    licence_class: free_proprietary
    optional: true
    interfaces: [cli]
    platforms: [linux, windows, macos]
    url: https://code.claude.com/
    limitations: ["Host only; all data come from the Python package through the MCP server or CLI."]
  - id: codex-cli
    name: OpenAI Codex CLI
    capabilities: [magnetics-agent-plugin]
    licence_class: open_source
    optional: true
    interfaces: [cli]
    platforms: [linux, windows, macos]
    url: https://github.com/openai/codex
    limitations: ["Host only; all data come from the Python package."]
connectors:
  - id: aipe-magnetics-database-mcp
    tool: mcp-python-sdk
    type: mcp
    repository: https://github.com/FulongLi/AIPE-Magnetics-Database
    license: NOASSERTION
    status: experimental
    supported_versions: ["mcp>=2,<3"]
    platforms: [linux, windows, macos]
    security_notes:
      - "Local stdio transport; no network listener, no API keys, no cloud services."
      - "Read-only tools; the server never writes files or executes repository content."
validation:
  status: tested
  evidence:
    - tests/test_records.py
    - tests/data/test_mas_catalogue.py
    - tests/store/test_store_api.py
    - tests/ingest/test_reproducible_imports.py
    - tests/ingest/test_deduplication.py
    - tests/interfaces/test_cli_mcp_plugins.py
    - data/reports/coverage.json
    - .github/workflows/ci.yml
  limitations:
    - "Third-party values are unreviewed; many MAS values originate from manufacturer datasheets whose terms are not covered by the MAS licence."
    - "Paderborn LEA records are GPL-3.0-only and kept as a separate copyleft subtree."
    - "Repository licence remains NOASSERTION pending owner decision."
documentation:
  - README.md
  - CHANGELOG.md
  - docs/data-format.md
  - docs/data-standard-v0.2.md
  - docs/source-catalogue.md
  - docs/ingestion.md
  - docs/provenance-and-limitations.md
  - docs/api.md
  - docs/migration-v0.3.md
  - LICENSING.md
extensions:
  aipe.magnetics:
    package: aipe-magnetics-database 0.3.0
    python: ">=3.10"
    runtime_requirements:
      required: [numpy, pydantic, jsonschema, referencing]
      optional: {hdf5: [h5py], mcp: [mcp]}
    interfaces:
      python_api: aipe_magnetics_database.api
      cli: aipe-magnetics-db
      mcp: "aipe-magnetics-db-mcp (stdio)"
      plugins: [plugins/claude/aipe-magnetics-database, plugins/codex/aipe-magnetics-database]
    platforms: [linux, windows, macos]
    consumers: [aipe.magnetics-design]
    standalone_operation: {requires_aipe_orchestrator: false, requires_registry_service: false, requires_other_domain_experts: false, requires_commercial_software: false, requires_llm_credentials: false}
